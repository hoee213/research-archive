<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyungIn Research Archive</title>
<meta name="description" content="직접 작성한 기업·산업 리포트 아카이브">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --panel-2:#F7F8F5; --line:#DDE1DA; --line-soft:#E9ECE6;
  --ink:#161B18; --ink-2:#3C463F; --muted:#6B756E; --faint:#959E97;
  --accent:#1F6F5C; --accent-soft:#E0EEE9; --hl:#FFE8A3;
  --c-company:#1F6F5C; --c-call:#9A3D6B; --c-visit:#2F6FA3; --c-industry:#8A5A12; --c-market:#4B57A6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C0B; --panel:#101311; --panel-2:#171B18; --line:#232925; --line-soft:#1A1F1C;
    --ink:#E6EBE7; --ink-2:#BCC5BF; --muted:#86918A; --faint:#5F6963;
    --accent:#5CC0A3; --accent-soft:#1D3530; --hl:#5A4A12;
    --c-company:#5CC0A3; --c-call:#E58AB5; --c-visit:#7DB4E8; --c-industry:#E0A954; --c-market:#9BA6F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0C0B; --panel:#101311; --panel-2:#171B18; --line:#232925; --line-soft:#1A1F1C;
  --ink:#E6EBE7; --ink-2:#BCC5BF; --muted:#86918A; --faint:#5F6963;
  --accent:#5CC0A3; --accent-soft:#1D3530; --hl:#5A4A12;
  --c-company:#5CC0A3; --c-call:#E58AB5; --c-visit:#7DB4E8; --c-industry:#E0A954; --c-market:#9BA6F0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:380px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:20px 18px 12px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{margin:0;font-size:19px;letter-spacing:-.02em;font-weight:750}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.count b{color:var(--ink);font-size:15px}
.search{margin-top:14px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);outline:none}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip .n{color:var(--faint);margin-left:3px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.list{overflow:auto;flex:1;padding:6px 0 24px}
.group{padding:14px 18px 4px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;display:flex;justify-content:space-between;position:sticky;top:0;background:var(--panel);z-index:1}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 18px 9px 15px;border-left:3px solid transparent;cursor:pointer;text-decoration:none;color:inherit}
.item:hover{background:var(--panel-2)}
.item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.it-top{display:flex;align-items:center;gap:7px}
.name{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.code{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.date{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.4}
.b-call{color:var(--c-call)} .b-company{color:var(--c-company)} .b-industry{color:var(--c-industry)} .b-market{color:var(--c-market)}
.desc{color:var(--muted);font-size:12.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.snip{color:var(--ink-2);font-size:12px;margin-top:4px;background:var(--panel-2);border-radius:6px;padding:4px 7px}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.ini{padding:8px 18px 2px;font-size:11px;font-weight:700;color:var(--accent);opacity:.85}
.none{padding:6px 18px 12px;color:var(--faint);font-size:12.5px}
.group{border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-2)}
.list .group:first-child{border-top:0}
.co .subs{display:none;padding-bottom:4px}
.co.open .subs{display:block}
.chev{display:inline-block;width:10px;color:var(--faint);transition:transform .15s;font-weight:700}
.co.open .chev{transform:rotate(90deg)}
.cnt{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px}
.item.sub{padding:6px 18px 6px 40px}
.stitle{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.b-visit{color:var(--c-visit)}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);min-height:52px}
.vtitle{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta{color:var(--muted);font-size:12.5px;white-space:nowrap}
.vbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
iframe{flex:1;border:0;width:100%;background:var(--bg)}
.foot{padding:10px 18px;border-top:1px solid var(--line-soft);color:var(--faint);font-size:11.5px;display:flex;justify-content:space-between}
.foot button{border:0;background:none;color:var(--faint);cursor:pointer;padding:0}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  aside{border-right:0;min-height:100vh}
  main{display:none}
  .top{padding:16px 16px 10px;position:sticky;top:0;background:var(--panel);z-index:2}
  .group{padding:14px 16px 4px;top:var(--topH,0)}
  .item{padding:10px 16px 10px 13px}
  .list{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="top" id="top">
      <div class="brand">
        <div><h1>MyungIn Research Archive</h1><div class="sub">기업분석 · 컨콜 · 탐방·콥데이 · 산업 · 시장</div></div>
        <div class="count"><b id="total">0</b>건</div>
      </div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="종목명·코드·섹터·본문 검색" autocomplete="off">
      </div>
      <div class="row" id="types"></div>
      <div class="row">
        <div class="seg" id="sort" style="margin-left:0">
          <button data-v="abc" aria-pressed="true">가나다순</button>
          <button data-v="date" aria-pressed="false">최신순</button>
        </div>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot"><span id="updated"></span><button id="theme" title="테마 전환">◐ 테마</button></div>
  </aside>
  <main>
    <div class="vbar" id="vbar">
      <span class="badge" id="vbadge"></span>
      <span class="vtitle" id="vtitle"></span>
      <span class="vmeta" id="vmeta"></span>
      <span class="sp"></span>
      <a class="btn" id="vopen" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
    <iframe id="frame" title="리포트 뷰어"></iframe>
  </main>
</div>
<script>
const TYPES = {all:"전체", company:"기업분석", call:"컨콜", visit:"탐방·콥데이", industry:"산업", market:"시장"};
const SECTIONS = ["company", "call", "visit", "industry", "market"];
const OPEN = new Set();
const st = {type:"all", sort:"abc", q:"", cur:null};
let R = [], TEXT = null, textLoading = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mobile = () => matchMedia("(max-width:900px)").matches;

// ㄱ~ㅎ → A~Z → 숫자·기타 순
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const BASE = {"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ"};
function initial(name){
  const c = (name || "").trim().charAt(0), code = c.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3){ const ch = CHO[Math.floor((code - 0xAC00) / 588)]; return {g:0, k:BASE[ch] || ch}; }
  if (/[a-z]/i.test(c)) return {g:1, k:c.toUpperCase()};
  return {g:2, k:"#"};
}
function cmpName(a, b){
  const ia = initial(a.name), ib = initial(b.name);
  return ia.g - ib.g || a.name.localeCompare(b.name, ia.g === 1 ? "en" : "ko", {sensitivity:"base", numeric:true}) || b.date.localeCompare(a.date);
}

function loadText(){
  if (TEXT || textLoading) return textLoading;
  textLoading = fetch("data/search.json?t=" + Date.now(), {cache:"no-store"}).then(r => r.json()).then(j => { TEXT = j; render(); });
  return textLoading;
}
function hl(s, q){
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i, i+q.length)) + "</mark>" + esc(s.slice(i+q.length));
}
function snippet(t, q){
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return null;
  const a = Math.max(0, i-40), b = Math.min(t.length, i+q.length+60);
  return (a>0?"…":"") + t.slice(a,b) + (b<t.length?"…":"");
}
function matches(r){
  if (st.type !== "all" && r.type !== st.type) return null;
  const q = st.q.trim();
  if (!q) return {r};
  const meta = [r.name, r.code, r.title, r.desc, ...r.sector].join(" ").toLowerCase();
  if (meta.includes(q.toLowerCase())) return {r};
  if (q.length >= 2 && TEXT && TEXT[r.id]){
    const s = snippet(TEXT[r.id], q);
    if (s) return {r, snip:s};
  }
  return null;
}
function itemHTML(m, withBadge){
  const r = m.r, q = st.q.trim();
  const tag = mobile() ? `a href="r/${r.id}.html"` : `button type="button"`;
  const end = mobile() ? "a" : "button";
  const sub = [r.sector.filter(s => s !== "미분류").join(" · "), r.title && r.title !== r.name ? r.title : ""].filter(Boolean).join("  —  ");
  return `<${tag} class="item" data-id="${r.id}" aria-current="${st.cur===r.id}">
    <div class="it-top">${withBadge?`<span class="badge b-${r.type}">${TYPES[r.type]}</span>`:""}
      <span class="name">${hl(r.name,q)}</span>${r.code?`<span class="code">${hl(r.code,q)}</span>`:""}
      <span class="date">${r.date.slice(2).replace(/-/g,".")}</span></div>
    ${sub?`<div class="desc">${hl(sub,q)}</div>`:""}
    ${m.snip?`<div class="snip">${hl(m.snip,q)}</div>`:""}
  </${end}>`;
}
function companyHTML(sec, name, ms){
  ms.sort((a,b) => b.r.date.localeCompare(a.r.date));
  const key = sec + "|" + name, q = st.q.trim();
  const open = OPEN.has(key) || !!q || ms.some(m => m.r.id === st.cur);
  const r0 = ms[0].r;
  const subs = ms.map(m => {
    const r = m.r;
    const tag = mobile() ? `a href="r/${r.id}.html"` : `button type="button"`;
    const end = mobile() ? "a" : "button";
    return `<${tag} class="item sub" data-id="${r.id}" aria-current="${st.cur===r.id}">
      <div class="it-top"><span class="stitle">${hl(r.title || r.name, q)}</span><span class="date">${r.date.slice(2).replace(/-/g,".")}</span></div>
      ${m.snip?`<div class="snip">${hl(m.snip,q)}</div>`:""}</${end}>`;
  }).join("");
  return `<div class="co${open?" open":""}"><button type="button" class="item cohead" data-co="${esc(key)}" aria-expanded="${open}">
    <div class="it-top"><span class="chev">›</span><span class="name">${hl(name,q)}</span>${r0.code?`<span class="code">${hl(r0.code,q)}</span>`:""}
      <span class="cnt">${ms.length}건</span><span class="date">${r0.date.slice(2).replace(/-/g,".")}</span></div>
    ${r0.sector.filter(x => x !== "미분류").length?`<div class="desc">${esc(r0.sector.filter(x => x !== "미분류").join(" · "))}</div>`:""}
  </button><div class="subs">${subs}</div></div>`;
}
function render(){
  const hits = R.map(matches).filter(Boolean);
  const cnt = {all:R.length}; SECTIONS.forEach(k => cnt[k] = 0);
  R.forEach(r => cnt[r.type] = (cnt[r.type] || 0) + 1);
  $("types").innerHTML = Object.keys(TYPES).map(k =>
    `<button class="chip" data-t="${k}" aria-pressed="${st.type===k}">${TYPES[k]}<span class="n">${cnt[k]||0}</span></button>`).join("");
  let html = "";
  if (!hits.length && st.q.trim()){
    html = `<div class="empty">${!TEXT && st.q.trim().length>=2 ? "본문 색인 불러오는 중…" : "검색 결과가 없습니다"}</div>`;
  } else if (st.sort === "date"){
    html = hits.sort((a,b) => b.r.date.localeCompare(a.r.date)).map(m => itemHTML(m, true)).join("")
      || `<div class="empty">아직 등록된 항목이 없습니다</div>`;
  } else {
    const secs = st.type === "all" ? SECTIONS : [st.type];
    html = secs.map(sec => {
      const arr = hits.filter(m => m.r.type === sec).sort((a,b) => cmpName(a.r, b.r));
      if (!arr.length && st.q.trim()) return "";
      const byName = new Map();
      arr.forEach(m => { const k = m.r.name.trim(); if (!byName.has(k)) byName.set(k, []); byName.get(k).push(m); });
      let body = "", last = null;
      byName.forEach((ms, name) => {
        const k = initial(name).k;
        if (k !== last){ body += `<div class="ini">${k}</div>`; last = k; }
        body += ms.length === 1 ? itemHTML(ms[0], false) : companyHTML(sec, name, ms);
      });
      if (!arr.length) body = `<div class="none">아직 등록된 항목이 없습니다</div>`;
      return `<div class="group"><span>${TYPES[sec]}</span><span>${arr.length}</span></div>` + body;
    }).join("");
  }
  $("list").innerHTML = html;
  $("total").textContent = R.length;
}
function show(id, push=true){
  const r = R.find(x => x.id === id);
  if (!r) return;
  if (mobile()){ location.href = `r/${id}.html`; return; }
  st.cur = id;
  $("frame").src = `r/${id}.html?v=${encodeURIComponent(r.date)}`;
  $("vopen").href = `r/${id}.html`;
  $("vbadge").className = `badge b-${r.type}`; $("vbadge").textContent = TYPES[r.type];
  $("vtitle").textContent = r.title || r.name;
  $("vmeta").textContent = [r.code, r.sector.join(", "), r.date].filter(Boolean).join(" · ");
  document.title = `${r.name} — MyungIn Research Archive`;
  if (push) history.replaceState(null, "", "#" + id);
  document.querySelectorAll(".item").forEach(e => e.setAttribute("aria-current", e.dataset.id === id));
}
function syncFrame(){
  try {
    const d = $("frame").contentDocument; if (!d || !d.documentElement) return;
    const th = document.documentElement.dataset.theme || "light";
    d.documentElement.dataset.theme = th;
    d.documentElement.style.colorScheme = th;
    let inv = d.getElementById("ra-invert");
    if (inv) inv.remove();
    if (th === "dark"){
      const bgOf = el => { const m = getComputedStyle(el).backgroundColor.match(/[\d.]+/g) || []; return m.length >= 3 && (m[3] === undefined || +m[3] > 0) ? m.slice(0,3).map(Number) : null; };
      const c = (d.body && bgOf(d.body)) || bgOf(d.documentElement) || [255,255,255];
      if ((0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255 > 0.6){
        inv = d.createElement("style"); inv.id = "ra-invert";
        inv.textContent = "html{filter:invert(.92) hue-rotate(180deg);background:#fff}img,video,picture,canvas{filter:invert(1) hue-rotate(180deg)}";
        d.head.appendChild(inv);
      }
    }
  } catch(_){}
}
$("frame").addEventListener("load", syncFrame);
$("list").addEventListener("click", e => {
  const co = e.target.closest(".cohead");
  if (co){ const k = co.dataset.co; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k);
    co.parentElement.classList.toggle("open"); co.setAttribute("aria-expanded", co.parentElement.classList.contains("open")); return; }
  const it = e.target.closest(".item");
  if (!it || mobile()) return;
  e.preventDefault(); show(it.dataset.id);
});
$("types").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  st.type = b.dataset.t; render();
});
$("sort").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  st.sort = b.dataset.v;
  $("sort").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  try { localStorage.setItem("ra-sort2", st.sort); } catch(_){}
  render();
});
let t;
$("q").addEventListener("input", e => {
  st.q = e.target.value;
  if (st.q.trim().length >= 2) loadText();
  clearTimeout(t); t = setTimeout(render, 120);
});
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  syncFrame();
  try { localStorage.setItem("ra-theme2", document.documentElement.dataset.theme); } catch(_){}
});
try {
  const th = localStorage.getItem("ra-theme2"); if (th) document.documentElement.dataset.theme = th;
  const so = localStorage.getItem("ra-sort2");
  if (so){ st.sort = so; $("sort").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === so)); }
} catch(_){}
const setTopH = () => document.documentElement.style.setProperty("--topH", $("top").offsetHeight + "px");
addEventListener("resize", () => { setTopH(); render(); });
fetch("data/reports.json?t=" + Date.now(), {cache:"no-store"}).then(r => r.json()).then(j => {
  R = j.reports;
  $("updated").textContent = "갱신 " + j.updated;
  render(); setTopH();
  const h = decodeURIComponent(location.hash.slice(1));
  const latest = [...R].sort((a,b) => b.date.localeCompare(a.date))[0];
  if (!mobile()) show(R.some(r => r.id === h) ? h : latest?.id, false);
});
</script>
</body>
</html>
